name: Gemini connection check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check key and model access without generation
        env:
          HL_GEMINI_API_KEY: ${{ secrets.HL_GEMINI_API_KEY }}
        run: python -m credible.service_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-connection-check
          retention-days: 7
          path: outputs/connection-check.json
