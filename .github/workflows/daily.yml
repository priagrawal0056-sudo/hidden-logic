name: Hidden Logic Daily Autopilot

# ───────────────────────────────────────────────────────────────────────────
# Runs the existing pipeline on GitHub Actions. Pull requests and non-main branches are
# dry-run paths. Optional manual pilot generation creates six unpublished review drafts and
# never requires YouTube OAuth. Every upload is also guarded by explicit publication approval.
# Production state is committed only after a normal, approved run.
# ───────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # cron is in UTC. Pick a time when you want the run to START.
    # Example: 09:30 UTC. Find your local time -> convert to UTC.
    # (e.g. if you want 3:00pm Singapore time = 07:00 UTC, use '0 7 * * *')
    - cron: '0 16 * * *'
  # Pushes to this working branch and PRs into main render previews without publishing.
  push:
    branches: ['arena/01a0fe0a-hidden-logic']
  pull_request:
    branches: [main]
  # Run manually from Actions to build one dry-run preview or the six unpublished pilots.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build one test video without uploading it"
        required: false
        type: boolean
        default: false
      generate_pilots:
        description: "Generate six unpublished editorial pilots for human review (no YouTube credentials used)"
        required: false
        type: boolean
        default: false

# Allow the workflow to push the updated state files back to the repo.
permissions:
  contents: write

# Never run two pipeline jobs at once (they'd fight over the state files).
concurrency:
  group: daily-autopilot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # includes an optional six-pilot batch with local ASR/frame review

    steps:
      - name: Check out the repo (your code + current state files)
        uses: actions/checkout@v4
        with:
          # we need write access to push state back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate required API and upload secrets
        env:
          HL_GEMINI_API_KEY: ${{ secrets.HL_GEMINI_API_KEY }}
          HL_PEXELS_API_KEY: ${{ secrets.HL_PEXELS_API_KEY }}
          HL_PIXABAY_API_KEY: ${{ secrets.HL_PIXABAY_API_KEY }}
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          DRY_RUN: ${{ github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          GENERATE_PILOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_pilots }}
        run: |
          missing=0
          if [[ -z "$HL_GEMINI_API_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret HL_GEMINI_API_KEY (required to write scripts)."
            missing=1
          fi
          if [[ -z "$HL_PEXELS_API_KEY" && -z "$HL_PIXABAY_API_KEY" ]]; then
            echo "::error::Set at least one b-roll secret: HL_PEXELS_API_KEY or HL_PIXABAY_API_KEY."
            missing=1
          fi
          if [[ "$DRY_RUN" != "true" && "$GENERATE_PILOTS" != "true" ]]; then
            if [[ -z "$YT_TOKEN_B64" ]]; then
              echo "::error::Missing GitHub Actions secret YT_TOKEN_B64 (required to upload)."
              missing=1
            fi
            if [[ -z "$CLIENT_SECRET_JSON" ]]; then
              echo "::error::Missing GitHub Actions secret CLIENT_SECRET_JSON (required for YouTube OAuth)."
              missing=1
            fi
          else
            echo "Dry-run/pilot batch: YouTube upload credentials are not needed."
          fi
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg (GitHub runners have it, but pin it to be safe)
        run: |
          # Microsoft/Azure CLI apt repos sometimes fail signature checks on GitHub's
          # hosted runners. They are unrelated to this pipeline, so remove them before
          # updating package indexes.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          # A transient mirror failure should not block installing ffmpeg if the runner's
          # package lists are already usable.
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-liberation
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline editorial and publication regression suite
        run: python -m unittest discover -v

      - name: Restore the YouTube OAuth token from secret
        # yt_token.pickle is binary, so we store it base64-encoded as a secret.
        if: ${{ github.ref_name == 'main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.generate_pilots != true)) }}
        env:
          YT_TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
        run: |
          printf '%s' "$YT_TOKEN_B64" | base64 -d > yt_token.pickle
          echo "token restored ($(wc -c < yt_token.pickle) bytes)"

      - name: Restore client_secret.json from secret
        if: ${{ github.ref_name == 'main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.generate_pilots != true)) }}
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > client_secret.json

      - name: Run the autopilot
        env:
          # Secrets are injected as the HL_* env vars your config_loader already reads.
          HL_GEMINI_API_KEY:        ${{ secrets.HL_GEMINI_API_KEY }}
          HL_PEXELS_API_KEY:        ${{ secrets.HL_PEXELS_API_KEY }}
          HL_PIXABAY_API_KEY:       ${{ secrets.HL_PIXABAY_API_KEY }}
          HL_FOOTBALLDATA_API_KEY:  ${{ secrets.HL_FOOTBALLDATA_API_KEY }}
          HL_ALERT_WEBHOOK_URL:     ${{ secrets.HL_ALERT_WEBHOOK_URL }}
          HL_ROLLOUT_ENABLED:       ${{ vars.HL_ROLLOUT_ENABLED }}
          HL_PILOT_REVIEW_COMPLETE: ${{ vars.HL_PILOT_REVIEW_COMPLETE }}
          DRY_RUN: ${{ github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          GENERATE_PILOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_pilots }}
          PYTHONUNBUFFERED: '1'
        run: |
          if [[ "$GENERATE_PILOTS" == "true" ]]; then
            echo "Generating six unpublished pilot drafts. YouTube upload is disabled."
            python -u pilot_batch.py --generate
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "Building one video without uploading it."
            python -u run_daily.py --hero --dry-run --count 1
          else
            python -u autopilot.py
          fi

      - name: Upload dry-run video artifact
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.dry_run || github.ref_name != 'main'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: hidden-logic-dry-run-${{ github.run_number }}
          path: drafts/draft_*/short.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload unpublished pilot review batch
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.generate_pilots }}
        uses: actions/upload-artifact@v4
        with:
          name: hidden-logic-unpublished-pilots-${{ github.run_number }}
          path: pilots/unpublished/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist stock clip IDs reserved by the pilot batch
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.generate_pilots }}
        run: |
          if [[ ! -f used_clips.json ]]; then
            echo "::error::The used-clip registry is missing; refusing to lose pilot reservations."
            exit 1
          fi
          git config user.name  "hidden-logic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -- used_clips.json
          if git diff --cached --quiet; then
            echo "No new stock clip reservations to save."
            exit 0
          fi
          git commit -m "[skip ci] reserve stock clips used by unpublished pilots"
          branch="$GITHUB_REF_NAME"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              echo "Pilot stock-clip reservations saved to $branch."
              pushed=1
              break
            fi
            echo "reservation push attempt $i failed, retrying..."
            sleep 5
          done
          if [[ "$pushed" -ne 1 ]]; then
            echo "::error::Pilot stock-clip reservations could not be pushed after three attempts."
            exit 1
          fi

      - name: Commit updated state files back to the repo
        # This is the CRITICAL step: without it, the pipeline forgets everything
        # each run (re-makes the same topics, loses its learning). We commit only
        # the state JSONs that the run updates - never secrets or rendered videos.
        if: ${{ always() && github.ref_name == 'main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.generate_pilots != true)) }}   # preserve state only after production runs
        run: |
          git config user.name  "hidden-logic-bot"
          git config user.email "bot@users.noreply.github.com"
          # Stage every state file the run may have touched. We use a broad approach:
          # add all tracked .json / .jsonl files plus the known state files, so nothing
          # the pipeline updates slips through a hardcoded list. Secrets and media are
          # already excluded by .gitignore, so this is safe.
          git add -f -- '*.json' '*.jsonl' 2>/dev/null || true
          # also re-add anything already tracked that changed (belt and suspenders)
          git add -u 2>/dev/null || true
          # Never commit secrets even if somehow present:
          git reset -q -- config.local.json client_secret.json yt_token.pickle '*.pickle' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit (run produced no on-disk state delta)."
          else
            echo "State files changed this run:"
            git diff --cached --name-only
            git commit -m "autopilot state update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The repo may have moved (you pushed code, or a prior run committed).
            # Rebase onto the branch that triggered this run, not always main, so a
            # workflow_dispatch on a feature branch can save its state there too.
            branch="$GITHUB_REF_NAME"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
                echo "State pushed to $branch."
                pushed=1
                break
              fi
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
            if [[ "$pushed" -ne 1 ]]; then
              echo "::error::State changes could not be pushed to $branch after three attempts."
              exit 1
            fi
          fi

      - name: Clean up secrets from the runner (belt and suspenders)
        if: always()
        run: |
          rm -f yt_token.pickle client_secret.json
