name: Hidden Logic Daily Autopilot
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview, reserve bootstrap, or production publishing'
        default: 'preview'
        type: choice
        options: [preview, bootstrap, publish]
permissions:
  contents: write
concurrency:
  group: hidden-logic-state
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      HL_GEMINI_API_KEY: ${{ secrets.HL_GEMINI_API_KEY }}
      HL_PEXELS_API_KEY: ${{ secrets.HL_PEXELS_API_KEY }}
      HL_PIXABAY_API_KEY: ${{ secrets.HL_PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Check requested mode and rollout
        id: mode
        env:
          WORKFLOW_EVENT: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: python3 -m credible.run_mode
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.run == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-credible.txt
      - name: Install free render tools
        if: steps.mode.outputs.run == 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update || true
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements-credible.txt
      - name: Run focused tests
        if: steps.mode.outputs.run == 'true'
        run: python -m unittest discover -s tests -v -b
      - name: Check release files
        if: steps.mode.outputs.run == 'true'
        run: python release_check.py
      - uses: actions/cache/restore@v4
        if: steps.mode.outputs.run == 'true'
        with:
          path: outputs/credible
          key: credible-reserve-v4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: credible-reserve-v4-
      - uses: actions/cache/restore@v4
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.mode == 'preview'
        with:
          path: outputs/preview
          key: credible-preview-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: credible-preview-v5-
      - name: Restore authoritative reserve manifest
        if: steps.mode.outputs.run == 'true'
        run: |
          mkdir -p outputs/credible
          if [ -f state/credible/reserve.json ]; then cp state/credible/reserve.json outputs/credible/reserve.json; fi
      - name: Restore YouTube credentials
        if: steps.mode.outputs.run == 'true' && steps.mode.outputs.mode == 'publish'
        env:
          TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
          CLIENT_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          python -c 'import os,base64,pathlib; pathlib.Path("yt_token.pickle").write_bytes(base64.b64decode(os.environ["TOKEN_B64"])); pathlib.Path("client_secret.json").write_text(os.environ["CLIENT_JSON"],encoding="utf-8")'
      - name: Produce Shorts
        if: steps.mode.outputs.run == 'true'
        env:
          REQUESTED_MODE: ${{ steps.mode.outputs.mode }}
        run: python -m credible.pipeline --mode "$REQUESTED_MODE"
      - name: Persist explicit state files
        if: always() && steps.mode.outputs.run == 'true' && steps.mode.outputs.mode == 'publish'
        run: python -m credible.state_io
      - uses: actions/cache/save@v4
        if: always() && steps.mode.outputs.run == 'true'
        with:
          path: outputs/credible
          key: credible-reserve-v4-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/cache/save@v4
        if: always() && steps.mode.outputs.run == 'true' && steps.mode.outputs.mode == 'preview'
        with:
          path: outputs/preview
          key: credible-preview-v5-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-review-${{ github.run_id }}
          retention-days: 7
          path: |
            outputs/credible/run-report.json
            outputs/credible/episodes/*/contact-sheet.jpg
            outputs/credible/episodes/*/episode.json
            outputs/credible/episodes/*/short.mp4
            outputs/credible/episodes/*/captions.ass
            outputs/credible/episodes/*/edit-plan.json
            outputs/credible/episodes/*/*.audio-quality.json
            outputs/credible/evidence/
            outputs/preview/
      - name: Remove credentials
        if: always()
        run: rm -f yt_token.pickle client_secret.json
