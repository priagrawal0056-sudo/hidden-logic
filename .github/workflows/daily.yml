name: Hidden Logic Daily Autopilot

# ───────────────────────────────────────────────────────────────────────────
# Runs the whole pipeline on GitHub's servers, on a schedule, with no laptop.
# After each run it COMMITS the updated state files (idea_bank, ab_log, etc.)
# back to the repo, so the pipeline remembers what it made across runs.
# ───────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # cron is in UTC. Pick a time when you want the run to START.
    # Example: 09:30 UTC. Find your local time -> convert to UTC.
    # (e.g. if you want 3:00pm Singapore time = 07:00 UTC, use '0 7 * * *')
    - cron: '0 4 * * *'
  # also lets you trigger a run by hand from the Actions tab (great for testing)
  workflow_dispatch:

# Allow the workflow to push the updated state files back to the repo.
permissions:
  contents: write

# Never run two pipeline jobs at once (they'd fight over the state files).
concurrency:
  group: daily-autopilot
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # generous; a 5-video run fits well inside this

    steps:
      - name: Check out the repo (your code + current state files)
        uses: actions/checkout@v4
        with:
          # we need write access to push state back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg (GitHub runners have it, but pin it to be safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore the YouTube OAuth token from secret
        # yt_token.pickle is binary, so we store it base64-encoded as a secret
        # and decode it back to a file here. (Setup guide explains how to make it.)
        run: |
          echo "${{ secrets.YT_TOKEN_B64 }}" | base64 -d > yt_token.pickle
          echo "token restored ($(wc -c < yt_token.pickle) bytes)"

      - name: Restore client_secret.json from secret
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Run the autopilot
        env:
          # Secrets are injected as the HL_* env vars your config_loader already reads.
          HL_GEMINI_API_KEY:        ${{ secrets.HL_GEMINI_API_KEY }}
          HL_PEXELS_API_KEY:        ${{ secrets.HL_PEXELS_API_KEY }}
          HL_PIXABAY_API_KEY:       ${{ secrets.HL_PIXABAY_API_KEY }}
          HL_FOOTBALLDATA_API_KEY:  ${{ secrets.HL_FOOTBALLDATA_API_KEY }}
          HL_ALERT_WEBHOOK_URL:     ${{ secrets.HL_ALERT_WEBHOOK_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          python -u autopilot.py

      - name: Commit updated state files back to the repo
        # This is the CRITICAL step: without it, the pipeline forgets everything
        # each run (re-makes the same topics, loses its learning). We commit only
        # the state JSONs that the run updates - never secrets or rendered videos.
        if: always()   # commit state even if the run partially failed, so progress isn't lost
        run: |
          git config user.name  "hidden-logic-bot"
          git config user.email "bot@users.noreply.github.com"
          # Only the state files that legitimately change each run:
          git add -f \
            idea_bank.json ab_log.json used_topics.json used_clips.json \
            winner_memory.json loser_memory.json hook_memory.json hook_library.json \
            analytics_memory.json channel_index.json view_velocity.json \
            comments_seen.json replies_done.json revived.json sequels.json \
            slot_stats.json last_boost.json content_brief.json video_context.json \
            trending_done.json previews_done.json matchday_done.json \
            weekly_compilations.json trend_seeds_cache.json el_key_rotation.json \
            2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "autopilot state update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # The repo may have moved (you pushed code, or a prior run committed).
            # Rebase our state commit on top before pushing so we never lose state to
            # a rejected push. Retry a couple of times in case of a race.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && { echo "State pushed."; break; }
              echo "push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Clean up secrets from the runner (belt and suspenders)
        if: always()
        run: |
          rm -f yt_token.pickle client_secret.json
