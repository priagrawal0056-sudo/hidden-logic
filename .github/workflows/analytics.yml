name: Hidden Logic Measured Analytics
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hidden-logic-state
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-credible.txt
      - run: pip install -r requirements-credible.txt
      - name: Restore credentials
        env:
          TOKEN_B64: ${{ secrets.YT_TOKEN_B64 }}
          CLIENT_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          python -c 'import os,base64,pathlib; pathlib.Path("yt_token.pickle").write_bytes(base64.b64decode(os.environ["TOKEN_B64"])); pathlib.Path("client_secret.json").write_text(os.environ["CLIENT_JSON"],encoding="utf-8")'
      - run: python -m credible.analytics
      - name: Persist measurements
        if: always()
        run: python -m credible.state_io
      - name: Save experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-report-${{ github.run_id }}
          path: state/credible/experiment_report.json
          retention-days: 28
      - name: Remove credentials
        if: always()
        run: rm -f yt_token.pickle client_secret.json
