name: Unpublished topic-bank pilots
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Test one category first; all runs the three-category review'
        type: choice
        default: home
        options: [home, food, clothing, all]
permissions:
  contents: read
concurrency:
  group: hidden-logic-state
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        category: ${{ fromJSON(inputs.category == 'all' && '["home","food","clothing"]' || format('["{0}"]', inputs.category || 'home')) }}
    env:
      PYTHONUNBUFFERED: '1'
      HL_GEMINI_API_KEY: ${{ secrets.HL_GEMINI_API_KEY }}
      HL_PEXELS_API_KEY: ${{ secrets.HL_PEXELS_API_KEY }}
      HL_PIXABAY_API_KEY: ${{ secrets.HL_PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-credible.txt
      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements-credible.txt
      - name: Run regression suite
        run: python -m unittest discover -s tests -q -b
      - uses: actions/cache/restore@v4
        with:
          path: outputs/topic-pilot-${{ matrix.category }}
          key: credible-pilot-v5-${{ matrix.category }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: credible-pilot-v5-${{ matrix.category }}-
      - name: Generate one unpublished episode
        run: python -m credible.single --category "${{ matrix.category }}" --output "outputs/topic-pilot-${{ matrix.category }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: outputs/topic-pilot-${{ matrix.category }}
          key: credible-pilot-v5-${{ matrix.category }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topic-pilot-${{ matrix.category }}
          retention-days: 7
          path: |
            outputs/topic-pilot-${{ matrix.category }}/result.json
            outputs/topic-pilot-${{ matrix.category }}/attempts.json
            outputs/topic-pilot-${{ matrix.category }}/draft.json
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/short.mp4
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/episode.json
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/contact-sheet.jpg
            outputs/topic-pilot-${{ matrix.category }}/diagnostics/*.json
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/voice.mp3*
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/stock-checkpoint.json
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/*.review.json
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/*.source.json
            outputs/topic-pilot-${{ matrix.category }}/episodes/*/timings.json
